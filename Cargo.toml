[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/vx-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
vx-core = { path = "crates/vx-core" }
vx-world = { path = "crates/vx-world" }
vx-mesh = { path = "crates/vx-mesh" }
vx-render = { path = "crates/vx-render" }

wgpu = "30.0.1"
winit = "0.30.13"
pollster = "0.4"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
fastnoise-lite = "1.1.1"
rayon = "1.12"
crossbeam-channel = "0.5.17"
profiling = "1.0.18"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
divan = "0.1.21"
png = "0.18.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
many_single_char_names = "allow"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true

